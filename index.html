<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>80s Riddle Challenge</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
/* ====== BASIC BODY ====== */
body {
  margin: 0;
  padding: 0;
  font-family: 'Press Start 2P', cursive;
  color: #00f7ff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle at center, #0f0321 0%, #1c0433 100%);
}

/* ====== ANIMATED GRID ====== */
body::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: linear-gradient(#3f0c6b 1px, transparent 1px),
                    linear-gradient(90deg, #3f0c6b 1px, transparent 1px);
  background-size: 40px 40px;
  animation: moveGrid 10s linear infinite;
  z-index: -1;
}
@keyframes moveGrid {
  from {background-position: 0 0, 0 0;}
  to {background-position: 40px 40px, 40px 40px;}
}

/* ====== TITLE & GAME SCREENS ====== */
h1, h2 {
  text-align: center;
  color: #ff00ff;
  text-shadow: 0 0 8px #ff00ff, 0 0 16px #ff00ff;
  font-size: 18px;
  line-height: 1.5;
}

.title-screen, .game-screen {
  background: rgba(0,0,0,0.6);
  padding: 20px;
  border: 2px solid #00f7ff;
  border-radius: 12px;
  box-shadow: 0 0 20px #00f7ff;
  max-width: 600px;
  text-align: center;
}

button {
  background: linear-gradient(90deg,#00f7ff,#ff00ff);
  border: none;
  color: #000;
  padding: 10px 20px;
  font-size: 14px;
  cursor: pointer;
  margin-top: 15px;
  border-radius: 8px;
  text-shadow: none;
}
button:hover {
  opacity: 0.85;
}

input {
  display: block;
  margin: 15px auto;
  padding: 10px;
  font-size: 14px;
  border: 1px solid #00f7ff;
  border-radius: 8px;
  width: 80%;
  text-align: center;
}

.hidden {display: none;}
#feedback {
  margin-top: 10px;
  font-size: 12px;
}
</style>
</head>
<body>
  <div class="title-screen">
    <h1>80s Riddle Challenge</h1>
    <button id="startBtn">Play Now</button>
  </div>

  <div class="game-screen hidden">
    <h2 id="riddle-text"></h2>
    <input type="text" id="answerInput" placeholder="Type your answer here">
    <button id="submitBtn">Submit</button>
    <p id="feedback"></p>
  </div>

<script>
/* ====== RIDDLES ====== */
const riddles = [
  {q:"Ask this question all day long, but always get completely different answers, and yet all the answers will be correct. What is the question?", a:"what time is it"},
  {q:"They come out at night without being called, and are lost in the day without being stolen. What are they?", a:"stars"},
  {q:"A man goes out for a walk during a storm with nothing to protect him from the rain. He doesn’t have a hat, a hood or an umbrella. But by the end of his walk, there isn’t a single wet hair on his head. Why doesn’t the man have wet hair?", a:"he’s bald"},
  {q:"The one who makes me cannot use me. The one who buys me will always buy me for someone else. The one who uses me doesn't know it. What am I?", a:"a coffin"},
  {q:"I’m tall when I’m young, and I’m short when I’m old. What am I?", a:"a candle"},
  {q:"David’s father has 3 sons: Snap, Crackle and _____.", a:"david"},
  {q:"You walk into a room and see a bed. On the bed, there are two dogs, five cats, a giraffe, six cows, and a goose. There are also three doves flying above the bed. How many legs are on the floor?", a:"six"},
  {q:"I have keys but open no locks; I have space but no room; you can enter but not go inside. What am I?", a:"a keyboard"},
  {q:"I can be long, I can be short; I can be grown, I can be bought; I can be painted, or I can be bare; I can be round or square. What am I?", a:"a nail"},
  {q:"I keep no keys but hold a door, You push and pull and push some more. I let you in without a sound, Yet when you leave I still stay round. What am I?", a:"a doorknob"}
];

let current = 0;

/* ====== ELEMENTS ====== */
const startBtn = document.getElementById('startBtn');
const titleScreen = document.querySelector('.title-screen');
const gameScreen = document.querySelector('.game-screen');
const riddleText = document.getElementById('riddle-text');
const answerInput = document.getElementById('answerInput');
const submitBtn = document.getElementById('submitBtn');
const feedback = document.getElementById('feedback');

/* ====== EVENTS ====== */
startBtn.addEventListener('click', () => {
  titleScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  loadRiddle();
});

submitBtn.addEventListener('click', checkAnswer);

function loadRiddle() {
  if (current < riddles.length) {
    riddleText.textContent = riddles[current].q;
    answerInput.value = '';
    feedback.textContent = '';
  } else {
    riddleText.textContent = "🎉 Congratulations! You've finished all the riddles!";
    answerInput.style.display='none';
    submitBtn.style.display='none';
  }
}

function checkAnswer() {
  const userAns = answerInput.value.trim().toLowerCase();
  if (userAns === riddles[current].a) {
    feedback.textContent = "✅ Correct!";
    current++;
    setTimeout(loadRiddle, 1000);
  } else {
    feedback.textContent = "❌ Try again!";
  }
}
</script>
</body>
</html>
